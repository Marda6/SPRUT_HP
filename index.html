<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СПРУТКАМ — Библиотека</title>
<link rel="icon" href="assets/img/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500&family=Roboto:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="app">

  <!-- ── Титульная строка (Figma 3064:14669) ───────────────── -->
  <header class="titlebar">
    <div class="titlebar__left">
      <div class="logo">
        <img class="logo__mark" src="assets/img/logo-mark.svg" alt="">
        <span class="logo__text">СПРУТКАМ</span>
      </div>
      <div class="titlebar__tools">
        <button class="iconbtn burger" type="button" aria-label="Меню">
          <span></span><span></span><span></span>
        </button>
        <button class="iconbtn" type="button" aria-label="Новый проект">
          <img src="assets/img/icn-new-project.svg" alt="">
        </button>
        <button class="iconbtn" type="button" aria-label="Открыть проект">
          <img src="assets/img/icn-open-project.svg" alt="">
        </button>
        <button class="iconbtn" type="button" aria-label="Сохранить проект">
          <img src="assets/img/icn-save-project.svg" alt="">
        </button>
      </div>
    </div>

    <nav class="tabs" aria-label="Открытые проекты">
      <span class="tabs__sep"></span>
      <button class="tab is-active" type="button">
        <span class="tab__title">Turn part probing 2</span>
        <img class="tab__close" src="assets/img/icn-tab-close-active.svg" alt="Закрыть">
      </button>
      <span class="tabs__sep"></span>
      <button class="tab" type="button">
        <span class="tab__title">Новый проект 2</span>
        <img class="tab__close" src="assets/img/icn-tab-close-active.svg" alt="Закрыть">
      </button>
      <span class="tabs__sep"></span>
      <button class="tab" type="button">
        <span class="tab__title">Новый проект 3</span>
        <img class="tab__close" src="assets/img/icn-tab-close-active.svg" alt="Закрыть">
      </button>
      <button class="tab-new" type="button" aria-label="Новая вкладка">
        <img src="assets/img/icn-plus.svg" alt="">
      </button>
    </nav>

    <div class="window-controls">
      <button class="iconbtn" type="button" aria-label="Ещё"><img src="assets/img/icn-win-chevron.svg" alt=""></button>
      <button class="iconbtn" type="button" aria-label="Настройки"><img src="assets/img/icn-settings.svg" alt=""></button>
      <button class="iconbtn" type="button" aria-label="Свернуть"><img src="assets/img/icn-win-minimize.svg" alt=""></button>
      <button class="iconbtn" type="button" aria-label="Развернуть"><img src="assets/img/icn-win-restore.svg" alt=""></button>
      <button class="iconbtn" type="button" aria-label="Закрыть"><img src="assets/img/icn-win-close.svg" alt=""></button>
    </div>
  </header>

  <!-- Навигация разделов (3064:14742). Верхний уровень: панель свойств
       принадлежит разделу, поэтому живёт ниже навигации, а не рядом с ней -->
  <nav class="section-nav" aria-label="Разделы">
    <!-- иконки-заглушки выводятся маской (.navtab__glyph--*): на тёмном
         активном табе перекрашиваются в цвет текста -->
    <div class="section-nav__group">
      <button class="navtab" type="button" data-section="recent">
        <span class="navtab__glyph navtab__glyph--recent" aria-hidden="true"></span>Недавние</button>
      <button class="navtab is-active" type="button" data-section="library" aria-current="page">
        <span class="navtab__glyph navtab__glyph--library" aria-hidden="true"></span>Библиотека</button>
      <button class="navtab" type="button" data-section="local">
        <span class="navtab__glyph navtab__glyph--local" aria-hidden="true"></span>Локальные</button>
      <!-- слева места хранения, справа отдельная библиотека компонентов -->
      <span class="section-nav__sep"></span>
      <button class="navtab" type="button" data-section="extensions">
        <span class="navtab__glyph navtab__glyph--extensions" aria-hidden="true"></span>Расширения</button>
    </div>
    <button class="navtab" type="button" data-section="licenses">
      <span class="navtab__glyph navtab__glyph--licenses" aria-hidden="true"></span>Менеджер лицензий</button>
  </nav>

  <div class="app__body">

    <!-- ── Контент (machine 3064:14741) ────────────────────── -->
    <main class="content">

      <!-- Заголовок и тулбар (3064:14760) -->
      <div class="toolbar" id="toolbar-library">
        <div class="toolbar__title">
          <h1 class="page-title">Библиотека</h1>
          <!-- Разделы библиотеки. Второй уровень навигации: Библиотека → раздел.
               Скрыт по просьбе Руслана вместе со страницей «Цифровое
               оборудование» — код оставлен, чтобы вернуть одним классом -->
          <div class="seg is-hidden" role="tablist" aria-label="Раздел библиотеки">
            <button class="seg__btn is-active" type="button" role="tab" aria-selected="true" data-realm="projects">Проекты</button>
            <button class="seg__btn" type="button" role="tab" aria-selected="false" data-realm="dmc" title="Digital Machine Centre">Цифровое оборудование</button>
          </div>
        </div>
        <div class="toolbar__actions">
          <!-- В узком окне сворачивается в иконку (см. .btn-primary--icon в styles.css) -->
          <button class="btn-primary btn-primary--icon" type="button" title="Загрузить проект">
            <span class="btn-primary__glyph" aria-hidden="true"></span>
            <span class="btn-primary__label">Загрузить проект</span>
          </button>
          <label class="search">
            <input type="search" id="search" placeholder="Поиск" aria-label="Поиск проектов">
            <span class="search__icon"><img src="assets/img/icn-search.svg" alt=""></span>
          </label>
          <button class="select" type="button">
            <span>Недавние</span>
            <span class="chev"><img src="assets/img/icn-chevron.svg" alt=""></span>
          </button>
          <button class="chip-filter" type="button">
            <span>Фильры</span>
          </button>
        </div>
      </div>

      <!-- Расширения: тулбар. Структура и контент — из референса Extension
           Store, оформление — как у «Библиотеки» -->
      <div class="toolbar is-hidden" id="toolbar-ext">
        <div class="toolbar__title">
          <h1 class="page-title">Расширения</h1>
          <!-- переключатель «Магазин | Установленные» не нужен:
               установленные — это чип рядом с «Все» -->
        </div>
        <div class="toolbar__actions">
          <label class="search">
            <input type="search" id="ext-search" placeholder="Поиск" aria-label="Поиск расширений">
            <span class="search__icon"><img src="assets/img/icn-search.svg" alt=""></span>
          </label>
          <button class="select" type="button">
            <span>Недавние</span>
            <span class="chev"><img src="assets/img/icn-chevron.svg" alt=""></span>
          </button>
        </div>
      </div>

      <!-- Менеджер лицензий: тулбар. Контент из референса License manager,
           оформление наше -->
      <div class="toolbar is-hidden" id="toolbar-lic">
        <div class="toolbar__title">
          <h1 class="page-title">Менеджер лицензий</h1>
          <!-- до авторизации скрыт (управляется в refreshLic) -->
          <div class="seg is-hidden" id="lic-seg" role="tablist" aria-label="Раздел менеджера лицензий">
            <button class="seg__btn is-active" type="button" role="tab" aria-selected="true" data-licview="sw">Лицензии ПО</button>
            <button class="seg__btn" type="button" role="tab" aria-selected="false" data-licview="ext">Расширения</button>
          </div>
        </div>
        <!-- аккаунт, обновление списка и меню действий — рендерятся в JS,
             видны только после входа -->
        <div class="licbar" id="lic-actions"></div>
      </div>

      <!-- Чипы-фильтры проектов (3287:8826) -->
      <div class="chips" id="chips-projects" role="group" aria-label="Фильтры проектов">
        <button class="chip is-active" type="button" data-filter="all">Все</button>
        <button class="chip" type="button" data-filter="official">Официальные</button>
        <button class="chip" type="button" data-filter="favorite">Избранные</button>
        <button class="chip" type="button" data-filter="mine">Мои проекты</button>
        <button class="chip" type="button" data-filter="shared">Доступные мне</button>
      </div>

      <!-- Цифровое оборудование: доступ и категории — один ряд, две группы -->
      <div class="chips is-hidden" id="chips-dmc">
        <span class="chips__set" role="group" aria-label="Фильтры компонентов">
          <button class="chip is-active" type="button" data-filter="all">Все</button>
          <button class="chip" type="button" data-filter="mine">Мои компоненты</button>
          <button class="chip" type="button" data-filter="favorite">Избранные</button>
        </span>
        <span class="chips__sep"></span>
        <!-- категории с количеством компонентов — рендерятся из DMC_KINDS -->
        <span class="chips__set" id="chips-dmc-kind" role="group" aria-label="Категории компонентов"></span>
      </div>

      <!-- Расширения: доступ и категории — как в «Цифровом оборудовании» -->
      <div class="chips is-hidden" id="chips-ext">
        <span class="chips__set" role="group" aria-label="Фильтры расширений">
          <button class="chip is-active" type="button" data-filter="all">Все</button>
          <button class="chip" type="button" data-filter="installed">Установленные</button>
          <button class="chip" type="button" data-filter="favorite">Избранные</button>
        </span>
        <span class="chips__sep"></span>
        <!-- фильтры-комбобоксы вместо чипов категорий — рендерятся
             в renderExtFilters() -->
        <span class="chips__set filters" id="ext-filters" role="group" aria-label="Фильтры расширений"></span>
      </div>

      <!-- Подборки (3064:15497) -->
      <section class="section">
        <div class="section__head">
          <h2 class="section__title">Подборки</h2>
          <a class="section__link" href="#">Посмотреть все</a>
        </div>
        <div class="grid grid--collections" id="collections"></div>
      </section>

      <!-- Проекты (3064:14798) -->
      <section class="section">
        <div class="section__head">
          <h2 class="section__title">Проекты</h2>
        </div>
        <div class="grid" id="projects"></div>
      </section>

      <!-- Цифровое оборудование: компоненты -->
      <section class="section is-hidden" id="realm-dmc">
        <div class="section__head">
          <h2 class="section__title">Компоненты</h2>
        </div>
        <div class="grid grid--dmc" id="dmc-items"></div>
      </section>

      <!-- Расширения. Заголовок секции не нужен — он уже есть в тулбаре -->
      <section class="section is-hidden" id="realm-ext">
        <div class="grid grid--ext" id="ext-items"></div>
      </section>

      <!-- Менеджер лицензий -->
      <section class="section is-hidden" id="realm-lic">
        <!-- текущая лицензия; в режиме «Обновить» становится редактируемой -->
        <div class="lic-hero" id="lic-hero"></div>

        <div class="lic-list__head">
          <h2 class="section__title">Лицензии ПО</h2>
          <div class="lic-list__tools">
            <label class="search">
              <input type="search" id="lic-search" placeholder="Поиск" aria-label="Поиск лицензий">
              <span class="search__icon"><img src="assets/img/icn-search.svg" alt=""></span>
            </label>
            <label class="switch">
              <input type="checkbox" id="lic-expired" checked>
              <span class="switch__track"></span>
              <span>Показывать истёкшие</span>
            </label>
          </div>
        </div>
        <div class="lic-sub" id="lic-sub"></div>
        <div class="lictable" id="lic-table"></div>

        <!-- вкладка «Расширения» менеджера — пока заглушка -->
        <div class="empty is-hidden" id="lic-ext-empty">
          <p>Лицензии расширений — раздел ещё не собран.</p>
        </div>

        <!-- первый запуск: пользователь ещё не авторизован.
             Слева приглашение, справа абстрактная геометрия в тонах системы -->
        <div class="lic-auth is-hidden" id="lic-auth">
          <div class="lic-auth__col">
            <h2 class="lic-auth__title">СПРУТКАМ</h2>
            <p class="lic-auth__text">Ведущая отечественная CAD/CAM-система</p>
            <div class="lic-auth__actions">
              <button class="btn btn--dark" type="button" id="lic-signin">Войти</button>
              <button class="btn" type="button">Запросить триал</button>
            </div>
          </div>
          <!-- рендер детали с траекториями; файл кладёт Руслан
               (assets/img/auth-part.png) -->
          <div class="lic-auth__art" aria-hidden="true">
            <img src="assets/img/auth-part.png" alt=""
              onerror="this.closest('.lic-auth__art').classList.add('is-hidden')">
          </div>
        </div>
      </section>

    </main>

    <!-- ── Панель расширения (та же анатомия, что у панели DMC) ─ -->
    <aside class="panel panel--dmc is-hidden" id="panel-ext" aria-label="Свойства расширения">
      <div class="pdmc__preview">
        <span class="pv" id="pext-preview"></span>
      </div>

      <div class="pdmc__head">
        <div class="pdmc__title">
          <h2 class="pdmc__name" id="pext-name"></h2>
          <button class="card-icon card-icon--fav is-on" type="button" id="pext-fav" aria-label="В избранное">
            <img src="assets/img/icn-star.svg" alt="">
          </button>
        </div>
        <div class="pdmc__badges" id="pext-badges"></div>
        <div class="pdmc__meta" id="pext-meta"></div>
      </div>

      <div class="pdmc__cta" id="pext-cta"></div>

      <div class="panel__scroll" id="pext-body"></div>
    </aside>

    <!-- ── Панель компонента DMC ───────────────────────────── -->
    <aside class="panel panel--dmc is-hidden" id="panel-dmc" aria-label="Свойства компонента">
      <div class="pdmc__preview">
        <span class="pv" id="pdmc-preview"></span>
      </div>

      <div class="pdmc__head">
        <div class="pdmc__title">
          <h2 class="pdmc__name" id="pdmc-name"></h2>
          <button class="card-icon card-icon--fav is-on" type="button" id="pdmc-fav" aria-label="В избранное">
            <img src="assets/img/icn-star.svg" alt="">
          </button>
        </div>
        <div class="pdmc__badges" id="pdmc-badges"></div>
        <div class="pdmc__meta" id="pdmc-meta"></div>
      </div>

      <!-- кнопки и цена закреплены над вкладками: получить пробную можно
           с любой вкладки -->
      <div class="pdmc__cta" id="pdmc-cta"></div>

      <div class="ptabs" role="tablist" aria-label="Разделы компонента">
        <button class="ptabs__btn is-active" type="button" role="tab" aria-selected="true" data-ptab="about">Обзор</button>
        <button class="ptabs__btn" type="button" role="tab" aria-selected="false" data-ptab="specs">Параметры</button>
        <button class="ptabs__btn" type="button" role="tab" aria-selected="false" data-ptab="links">Связи</button>
      </div>

      <div class="panel__scroll" id="pdmc-body"></div>
    </aside>

    <!-- ── Панель свойств (machine 3064:14827) ─────────────── -->
    <aside class="panel" id="panel" aria-label="Свойства проекта">
      <div class="panel__preview">
        <span class="pv" id="panel-preview"></span>
      </div>

      <div class="panel__head">
        <h2 class="panel__name" id="panel-name">From Drawing</h2>
        <span class="panel__visibility" id="panel-visibility"></span>
      </div>

      <div class="panel__actions">
        <button class="btn" type="button">Поделиться</button>
        <button class="btn" type="button">3D просмотр</button>
        <button class="btn btn--dark" type="button">Открыть</button>
      </div>

      <!-- скроллится только содержимое: превью, шапка и нижние кнопки закреплены -->
      <div class="panel__scroll">
        <div class="pblock">
          <div class="pblock__title">Информация</div>
          <div id="panel-props"></div>
        </div>

        <div class="panel__divider"></div>

        <div class="pblock pblock--wrap">
          <div class="pblock__title">Оси</div>
          <div class="tag-list" id="panel-axes"></div>
        </div>

        <div class="panel__divider"></div>

        <div class="pblock pblock--wrap">
          <div class="pblock__title">Тэги</div>
          <div class="tag-list" id="panel-tags"></div>
        </div>

        <div class="panel__divider"></div>

        <div class="pblock">
          <div class="pblock__title">Пользователи</div>
          <div class="userlist" id="panel-users"></div>
        </div>
      </div>

      <div class="panel__divider"></div>

      <div class="panel__foot">
        <div class="panel__foot-group">
          <button class="btn-text" type="button">Удалить</button>
          <button class="btn-text" type="button">Архив</button>
        </div>
        <button class="btn-text" type="button">Изменить</button>
      </div>
    </aside>

  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
